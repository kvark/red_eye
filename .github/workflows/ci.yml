name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install lavapipe
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --target aarch64-linux-android -p red-eye-xr -- -D warnings
      - name: Fetch models and references
        run: |
          pip install -r tools/requirements.txt
          tools/fetch_yolox.sh
          tools/fetch_dfine.sh
      - run: cargo test --locked --release -- --include-ignored
      - run: cargo run --locked --release --example preview -- - out
      - run: cargo run --locked --release --example detect -- ref/yolox_nano.safetensors ref/dog.jpg out/detect.png
      - run: cargo run --locked --release --example detect -- ref/dfine_nano_640x480/model.onnx ref/dog.jpg out/detect-dfine.png
      - run: cargo run --locked --release --example hud -- ref/dfine_nano_640x480/model.onnx ref/dog.jpg bicycle out
      - name: YOLOX through the ONNX importer
        run: |
          cargo run --locked --release --example onnx_check -- ref/yolox_nano_onnx
          cargo run --locked --release --example onnx_check -- ref/yolox_tiny_onnx

[package]
name = "red-eye"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "T-800 style augmented vision for Meta Quest 3, on Blade and Meganeura"
license = "MIT"
repository = "https://github.com/kvark/red_eye"
publish = false

[workspace]
members = ["android-xr"]

[dependencies]
# Pinned to the exact blade-graphics revision meganeura depends on. Both
# crates must resolve to the *same* blade-graphics so the
# `Arc<blade_graphics::Context>` the renderer creates is the type
# meganeura's `SessionConfig::gpu` accepts. Bump both pins together.
blade-graphics = { version = "0.9", git = "https://github.com/kvark/blade", rev = "7569282e1f06d34b44f2cdb030b72fc8ec56a417" }
meganeura = { version = "0.3", git = "https://github.com/kvark/meganeura", rev = "07f2f51a60e38fc6401ca781082231138dd493e5", default-features = false }
# The HUD: egui owns fonts and layout, blade-egui paints it, and blade-util's
# buffer belt feeds the text grid. Same Blade revision as blade-graphics, and
# the egui version blade-egui is built against.
blade-egui = { version = "0.9", git = "https://github.com/kvark/blade", rev = "7569282e1f06d34b44f2cdb030b72fc8ec56a417" }
blade-util = { version = "0.5", git = "https://github.com/kvark/blade", rev = "7569282e1f06d34b44f2cdb030b72fc8ec56a417" }
egui = { version = "0.34", features = ["bytemuck"] }
blade-macros = "0.3"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"

[dev-dependencies]
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
too_many_arguments = "allow"
new_without_default = "allow"

[[example]]
name = "preview"
path = "examples/preview.rs"

[[example]]
name = "detect"
path = "examples/detect.rs"

[[example]]
name = "onnx_check"
path = "examples/onnx_check.rs"

[[example]]
name = "hud"
path = "examples/hud.rs"



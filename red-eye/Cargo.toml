[package]
name = "red-eye"
description = "RedEye: T-800 style augmented vision, a MAR app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A cdylib for the APK, and an rlib so the HUD's example and tests build on
# a desktop.
[lib]
name = "red_eye"
crate-type = ["cdylib", "rlib"]

[dependencies]
mar-core.workspace = true
blade-graphics.workspace = true
egui.workspace = true
log.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
mar-shell.workspace = true
ndk-glue.workspace = true

[dev-dependencies]
env_logger.workspace = true
image.workspace = true

[lints]
workspace = true

[package.metadata.android]
# The package name RedEye has always had, so installs, grants and the adb
# commands in the docs carry over.
package = "rust.red_eye_xr"
build_targets = ["aarch64-linux-android"]
# libopenxr_loader.so lives here; Blade's Android examples ship it.
runtime_libs = "../../blade/examples-android/libs"
label = "RedEye"

[package.metadata.android.sdk]
# 34 is what Meta requires for the Passthrough Camera API, and NDK r27 is
# what provides the API-34 Camera2 sysroot.
min_sdk_version = 34
target_sdk_version = 34

[package.metadata.android.signing.release]
path = "../../blade/examples-android/keystore/debug.keystore"
keystore_password = "android"
key_alias = "androiddebugkey"
key_password = "android"

# Without this Horizon OS assumes controllers are required and blocks
# launch behind a system dialog. Hand tracking is the honest declaration:
# the HUD will take hand input, not controllers.
[[package.metadata.android.uses_feature]]
name = "oculus.software.handtracking"
required = false

[[package.metadata.android.uses_permission]]
name = "com.oculus.permission.HAND_TRACKING"

# Passthrough camera. HEADSET_CAMERA is a runtime permission: declaring it
# is necessary but not sufficient.
[[package.metadata.android.uses_permission]]
name = "horizonos.permission.HEADSET_CAMERA"

[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

[[package.metadata.android.uses_feature]]
name = "android.hardware.camera2.any"
required = false

# Compositor passthrough (the target world view) and environment depth.
[[package.metadata.android.uses_feature]]
name = "com.oculus.feature.PASSTHROUGH"
required = false

[[package.metadata.android.uses_permission]]
name = "com.oculus.permission.USE_SCENE"

# Voice commands. A runtime permission: grant it with adb, or the app runs
# without voice.
[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[package.metadata.android.application]
label = "RedEye"

[[package.metadata.android.application.meta_data]]
name = "com.oculus.vr.focusaware"
value = "true"

[package.metadata.android.application.activity]
label = "RedEye"
theme = "@android:style/Theme.Black.NoTitleBar.Fullscreen"
config_changes = "density|keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|uiMode"
launch_mode = "singleTask"
orientation = "landscape"
resizeable_activity = false

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = [
    "com.oculus.intent.category.VR",
    "android.intent.category.LAUNCHER",
]
